</style>
<script>
(() => {
  const root = document.getElementById('sr-prototype');
  const icon = name => `<span class="sr-icon"><i data-lucide="${name}" aria-hidden="true"></i></span>`;
  const esc = str => String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const initialSkills = [
    {id:'frontend-design',desc:'设计并构建有辨识度的前端界面',type:'git',project:true,links:['ok','missing'],refs:2,commit:'4c7e8a1'},
    {id:'handoff',desc:'整理上下文，交接下一阶段工作',type:'local',project:true,links:['ok','ok'],refs:3},
    {id:'research',desc:'查阅资料并整理可追溯的研究结论',type:'git',project:true,links:['ok','ok'],refs:2,commit:'b912fd0'},
    {id:'drawio',desc:'创建与维护结构化流程图',type:'git',project:true,links:['ok','conflict'],refs:1,commit:'762c1de'},
    {id:'theme-factory',desc:'为页面与文档建立一致的视觉主题',type:'git',project:true,links:['ok','missing'],refs:1,commit:'a83d4c2'},
    {id:'web-testing',desc:'验证页面交互与关键用户流程',type:'local',project:true,links:['ok','ok'],refs:1},
    {id:'pdf-tools',desc:'提取、合并与检查 PDF 文档',type:'local',project:false,links:[],refs:0},
    {id:'api-review',desc:'检查 API 契约与错误处理',type:'git',project:false,links:[],refs:0,commit:'e14a69c'}
  ];
  const navs = [{id:'project',scope:'workspace',label:'工作区配置',icon:'folder-cog'},{id:'workspace-settings',scope:'workspace',label:'设置',icon:'settings-2'},{id:'registry',scope:'global',label:'中心仓库',icon:'boxes'},{id:'groups',scope:'global',label:'共享分组',icon:'layers'},{id:'presets',scope:'global',label:'目标预设',icon:'scan-line'},{id:'settings',scope:'global',label:'设置',icon:'settings-2'}];
  const workspaceViews = [{id:'skills',label:'Skills',icon:'list-checks'},{id:'targets',label:'Agent 目标',icon:'bot'},{id:'yaml',label:'项目 YAML',icon:'file-code-2'}];
  const shared = {density:'舒适',scenario:'标准项目',initOutcome:'成功'};
  let saved = null;
  try { saved = window.openai?.widgetState; } catch {}
  const restored = saved?.privateContent?.navigationVersion===4?saved.privateContent:null;
  const instances = [];
  function persist(state) {
    try { window.openai?.setWidgetState({modelContent:{layout:'工作台',scope:navs.find(n=>n.id===state.page)?.scope==='global'?'全局管理':'当前工作区',workspace:state.project,initialized:state.initialized,page:state.page==='project'?workspaceViews.find(v=>v.id===state.tab)?.label:navs.find(n=>n.id===state.page)?.label,selectedSkill:state.selected},privateContent:{navigationVersion:4,page:state.page,tab:state.tab}})?.catch(()=>{}); } catch {}
  }
  function makeApp(id) {
    const el = document.getElementById(id);
    const state = {page:navs.some(n=>n.id===restored?.page)?restored.page:'project',tab:workspaceViews.some(v=>v.id===restored?.tab)?restored.tab:'skills',lastWorkspacePage:'project',lastGlobalPage:'registry',skills:structuredClone(initialSkills),selected:'frontend-design',search:'',filter:'all',detail:false,modal:null,toast:'',project:'personal-site',center:'~/.skill-registry/skills',groups:[{name:'daily',desc:'日常开发常用工具',skills:['handoff','research','web-testing']},{name:'design',desc:'界面设计与可视化',skills:['frontend-design','drawio','theme-factory']}],targets:[{id:'claude-code',name:'Claude Code',path:'.claude/skills',source:'项目配置'},{id:'codex',name:'Codex',path:'.codex/skills',source:'自动发现'}],presets:[{id:'claude-code',path:'.claude/skills',default:true},{id:'codex',path:'.codex/skills'},{id:'agent-generic',path:'.agents/skills'},{id:'cursor',path:'.cursor/rules'}],dirty:false,yamlDraft:null,untracked:[],applied:false,checked:false};
    Object.assign(state,{projectPath:'~/Projects/personal-site',initialized:true,justInitialized:false,initializationStatus:'idle',initFailedOnce:false,workspaceRecords:{},hiddenWorkspaces:[]});
    let lastFocus=null, toastTimer;
    const catalog=()=>state.skills.filter(s=>!s.removed);
    const projectSkills=()=>state.skills.filter(s=>s.project);
    function defaultTargets(){const p=state.presets.find(p=>p.default)||state.presets[0];return p?[{id:p.id,name:p.id==='claude-code'?'Claude Code':p.id,path:p.path,source:'默认回退'}]:[];}
    function snapshotWorkspace(){state.workspaceRecords[state.projectPath]={name:state.project,initialized:state.initialized,skillIds:projectSkills().map(s=>s.id),links:Object.fromEntries(projectSkills().map(s=>[s.id,[...s.links]])),targets:structuredClone(state.targets),untracked:[...state.untracked]};}
    function selectWorkspace(projectPath,{save=true}={}){
      snapshotWorkspace();
      const cleaned=projectPath.trim().replace(/\/+$/,'')||'/';
      state.hiddenWorkspaces=state.hiddenWorkspaces.filter(path=>path!==cleaned);
      const record=state.workspaceRecords[cleaned]||{name:cleaned.split('/').pop()||cleaned,initialized:false,skillIds:[],links:{},targets:[],untracked:[]};
      state.projectPath=cleaned;state.project=record.name;state.initialized=record.initialized;state.justInitialized=false;state.initializationStatus='idle';state.initFailedOnce=false;
      state.targets=structuredClone(record.targets);state.untracked=[...record.untracked];
      state.skills.forEach(s=>{s.project=record.skillIds.includes(s.id);s.links=[...(record.links[s.id]||[])];});
      state.workspaceRecords[cleaned]=record;state.yamlDraft=null;state.dirty=false;state.modal=null;state.page='project';state.tab='skills';state.lastWorkspacePage='project';state.search='';state.filter='all';state.detail=false;shared.scenario='标准项目';
      render();if(save)persist(state);
    }
    const scope=()=>navs.find(n=>n.id===state.page)?.scope||'workspace';
    const workspaceConfig=()=>state.projectPath+'/.skill-registry/config.yaml';
    function scopeSwitch(){return `<div class="sr-scope-switch" role="group" aria-label="配置作用域"><button type="button" data-action="scope-workspace" aria-pressed="${scope()==='workspace'}">${icon('folder')}工作区</button><button type="button" data-action="scope-global" aria-pressed="${scope()==='global'}">${icon('globe')}全局管理</button></div>`;}
    function contextPicker(){return scope()==='workspace'?`<button type="button" class="sr-project-switch" data-action="switch-project">${icon('folder')}<span>${esc(state.project)}<small>${state.initialized?'当前工作区':'未初始化'}</small></span><span class="sr-chevron">${icon('chevrons-up-down')}</span></button>`:'';}
    function scopeBanner(){const global=scope()==='global';const path=global?(state.page==='registry'?state.center:'~/.skill-registry/global.yaml'):workspaceConfig();const notes={registry:'修改这里的 Skill 内容，会影响所有指向它的工作区链接。',groups:'这里维护全局分组。添加到工作区时，只将成员展开为工作区引用。',presets:'这里编辑全局模板；工作区已保存的显式路径不会被自动覆盖。',settings:'本页设置由本机所有工作区共享。'};return `<div class="sr-scope-banner" aria-label="当前作用域">${icon(global?'globe':'folder-cog')}<div class="sr-scope-copy"><div class="sr-scope-title">${global?'全局管理 · 本机共享':'当前工作区 · '+esc(state.project)}</div><div class="sr-path">${!global&&!state.initialized?'待创建：':''}${esc(path)}</div><p class="sr-note">${global?notes[state.page]:state.initialized?state.page==='workspace-settings'?'本页设置仅作用于当前工作区。':'本页维护该工作区的配置；Skill 内容仍来自全局中心。':'未找到 SkillRegistory 配置，可在当前文件夹初始化。'}</p></div><span class="sr-scope-tag">${global?'所有工作区共享':'仅此工作区'}</span></div>`;}
    const totals=()=>projectSkills().flatMap(s=>s.links).reduce((a,s)=>(a[s]=(a[s]||0)+1,a),{ok:0,missing:0,conflict:0});
    const btn=(label,action,cls='',extra='')=>`<button type="button" class="sr-button ${cls}" data-action="${action}" ${extra}>${label}</button>`;
    const notice=(message,type='warn',action='')=>`<div class="sr-alert ${type==='warn'?'':type}" ${type==='error'?'role="alert"':''}>${icon(type==='error'?'circle-alert':type==='ok'?'circle-check':'triangle-alert')}<span>${message}</span>${action?`<button type="button" data-action="${action}">查看详情 →</button>`:''}</div>`;
    const yamlText=()=>{const skills=projectSkills(),explicit=state.targets.filter(t=>t.source==='项目配置');return (skills.length?`skills:\n${skills.map(s=>'  - '+s.id).join('\n')}\n`:'skills: []\n')+(explicit.length?`\ntargets:\n${explicit.map(t=>'  '+t.id+':\n    path: '+t.path).join('\n')}\n`:'');};
    function parseDemoYaml(text){
      const ids=[],targets=[];let mode='',current=null;
      for(const line of text.split('\n')){
        if(!line.trim()||line.trim().startsWith('#'))continue;
        if(/^skills:\s*(\[\])?\s*$/.test(line)){mode='skills';continue;}
        if(/^targets:\s*(\{\})?\s*$/.test(line)){mode='targets';continue;}
        const skill=line.match(/^  - ([a-zA-Z0-9_-]+)\s*$/);
        if(mode==='skills'&&skill){ids.push(skill[1]);continue;}
        const target=line.match(/^  ([a-zA-Z0-9_-]+):\s*$/);
        if(mode==='targets'&&target){current={id:target[1],name:target[1],source:'项目配置'};targets.push(current);continue;}
        const path=line.match(/^    path: (.+?)\s*$/);
        if(mode==='targets'&&current&&path){current.path=path[1];continue;}
        throw new Error('稿内演示仅支持 skills 列表与 targets 路径，请保持示例缩进。');
      }
      if(!/^skills:/m.test(text)||targets.some(t=>!t.path))throw new Error('配置需要 skills，且每个显式 Target 都需要 path。');
      if(ids.some(id=>!catalog().some(s=>s.id===id)))throw new Error('配置引用了中心不存在的 Skill。');
      return {ids:[...new Set(ids)],targets};
    }
    const targetDirectory=t=>t.path.startsWith('~/')||t.path.startsWith('/')?t.path:state.projectPath+'/'+t.path;
    function targetConfigPath(path){const prefix=state.projectPath.replace(/\/$/,'')+'/';return path===state.projectPath?'.':path.startsWith(prefix)?path.slice(prefix.length):path;}
    function chooseTargetDirectory(draft,fromPanel=false){const current=draft.pathDraft?targetDirectory({path:draft.pathDraft}):state.projectPath;const folders=[...new Set([current,state.projectPath+'/.agents/skills',state.projectPath+'/.claude/skills'])];return openModal('folder-picker',{scope:'workspace',pickerTitle:'选择 Agent 目标目录',selectorTarget:'agent-target',parentPath:state.projectPath,folders,selectedPath:current,returnTo:{type:'target',...draft},cancelToPanel:fromPanel});}
    const pathFor=(skill,t)=>targetDirectory(t)+'/'+skill;
    function navHtml(){
      if(scope()==='workspace')return workspaceViews.map(v=>`<button type="button" class="sr-nav ${state.page==='project'&&state.tab===v.id?'active':''}" data-tab="${v.id}" ${!state.initialized&&v.id!=='skills'?'disabled':''} ${state.page==='project'&&state.tab===v.id?'aria-current="page"':''}>${icon(v.icon)}${v.label}${v.id==='skills'||v.id==='targets'?`<span class="sr-count">${v.id==='skills'?projectSkills().length:state.targets.length}</span>`:''}</button>`).join('')+`<button type="button" class="sr-nav ${state.page==='workspace-settings'?'active':''}" data-page="workspace-settings" ${state.page==='workspace-settings'?'aria-current="page"':''}>${icon('settings-2')}设置</button>`;
      return navs.filter(n=>n.scope==='global').map(n=>`<button type="button" class="sr-nav ${state.page===n.id?'active':''}" data-page="${n.id}" ${state.page===n.id?'aria-current="page"':''}>${icon(n.icon)}${n.label}${n.id==='registry'?`<span class="sr-count">${catalog().length}</span>`:''}</button>`).join('');
    }
    function compactNavigation(){const options=scope()==='workspace'?[...workspaceViews.map(v=>({value:'project:'+v.id,label:v.label})),{value:'workspace-settings',label:'设置'}]:navs.filter(n=>n.scope==='global').map(n=>({value:n.id,label:n.label}));const selected=state.page==='project'?'project:'+state.tab:state.page;return `<div class="sr-top-nav">${scopeSwitch()}${contextPicker()}<select class="sr-select" aria-label="${scope()==='workspace'?'工作区页面':'全局管理页面'}" data-role="nav-select">${options.map(o=>`<option value="${o.value}" ${selected===o.value?'selected':''} ${!state.initialized&&o.value.startsWith('project:')&&o.value!=='project:skills'?'disabled':''}>${o.label}</option>`).join('')}</select></div>`;}
    function render(){
      const t=totals(),isSettings=state.page==='workspace-settings'||state.page==='settings';
      const detailMode=!!(state.detail&&window.matchMedia?.('(max-width:930px)')?.matches);
      const pageKey=[state.page,state.page==='project'?state.tab:'',scope()==='workspace'?state.projectPath:'',detailMode?'detail':'list'].join('|');
      const previousMain=el.querySelector('.sr-main'),previousBody=el.querySelector('.sr-modal-body');
      const mainScroll=previousMain?.dataset?.pageKey===pageKey?previousMain.scrollTop:0;
      const bodyScroll=previousBody&&previousBody.dataset?.modalType===state.modal?.type?previousBody.scrollTop:0;
      el.innerHTML=`<div class="sr-host">${icon('search')}<span>SkillRegistory</span><span class="sr-key">↵</span><span class="sr-host-name">uTools</span></div>
        ${compactNavigation()}
        <div class="sr-layout"><aside class="sr-side"><div class="sr-brand"><div class="sr-brand-icon">${icon('layers-2')}</div><div>SkillRegistory<small>本机 Skill 管理</small></div></div>${scopeSwitch()}${scope()==='workspace'?`<div>${contextPicker()}</div>`:''}<nav aria-label="${scope()==='workspace'?'工作区导航':'全局导航'}">${navHtml()}</nav></aside><main class="sr-main ${state.detail?'show-detail':''}" data-page-key="${esc(pageKey)}">${scopeBanner()}${renderPage(t)}</main></div>
        <footer class="sr-footer"><span>${icon(scope()==='workspace'?'folder':'globe')}${scope()==='workspace'?'工作区：'+esc(state.project):'全局共享 · '+catalog().length+' 个 Skill'}</span><span>${isSettings?'设置已加载':scope()==='global'?'修改共享资源前请核对影响范围':!state.initialized?'尚未初始化':state.dirty?'工作区配置有未保存修改':!projectSkills().length?'配置已创建 · 0 个 Skill':t.conflict+' 处链接冲突'}${state.page==='registry'||state.page==='project'&&state.tab==='skills'&&state.initialized&&projectSkills().length?' <span class="sr-key">⌘ K 搜索</span>':''}</span></footer>${state.modal?renderModal():''}${state.toast?`<div class="sr-toast" role="status">${icon('check')}${esc(state.toast)}</div>`:''}`;
      refreshIcons();
      const main=el.querySelector('.sr-main'),body=el.querySelector('.sr-modal-body');
      if(main)main.scrollTop=mainScroll||0;
      if(body)body.scrollTop=bodyScroll||0;
    }
    function refreshIcons(){try{globalThis.lucide?.createIcons({attrs:{width:16,height:16}});}catch{}}
    function header(eyebrow,title,sub,actions){return `<div class="sr-eyebrow">${esc(eyebrow)}</div><div class="sr-topline"><div style="min-width:0"><h1>${esc(title)}</h1><div class="${sub?.startsWith('~')?'sr-path':'sr-sub'}">${esc(sub||'')}</div></div><div class="sr-actions">${actions||''}</div></div>`;}
    function renderPage(t){
      if(state.page==='project'){
        const view=workspaceViews.find(v=>v.id===state.tab);
        let head=header('当前工作区 / '+state.project,view?.label||'Skills',state.tab==='skills'?'选择此工作区需要的 Skills，并提供给当前生效的 Agent 目标。':state.tab==='targets'?'查看当前工作区生效的 Agent，以及各自的部署路径、来源和链接状态。':'只编辑此工作区的 config.yaml。',state.initialized&&state.tab==='skills'&&projectSkills().length?btn(icon('plus')+' 从全局中心添加','add-project')+btn(icon('git-pull-request-arrow')+' 应用到此工作区','preview','primary'):state.initialized&&state.tab==='targets'?btn(icon('plus')+' 添加目标','new-target','primary'):'');
        if(!state.initialized)return head+renderUninitialized();
        if(state.tab==='skills'&&!projectSkills().length)return head+renderEmptyWorkspace();
        if(shared.scenario==='YAML 错误')return head+notice('配置无法解析：第 4 行缺少列表标记。原文件已保留。','error')+`<textarea class="sr-code" aria-label="待修复 YAML">skills:\n  - handoff\n  - research\n  frontend-design</textarea><div class="sr-form-row">${btn('查看配置原文','open-file')}${btn('返回正常示例','normal','primary')}</div>`;
        let external=shared.scenario==='外部修改'?notice('配置已被外部修改。本地草稿保留，保存前需要比较版本。','warn','external'):'';
        return head+external+`<section aria-label="${esc(view?.label||'工作区配置')}">${state.tab==='targets'?renderTargets():state.tab==='yaml'?renderYaml():`${notice(`期望 ${projectSkills().length*state.targets.length} 条链接：${t.missing} 条待创建，${t.conflict} 处与本地内容冲突。`,'warn','preview')}<div class="sr-toolbar"><label class="sr-search">${icon('search')}<input data-role="search" aria-label="搜索项目 Skill" placeholder="搜索 Skill 名称、描述…" value="${esc(state.search)}"></label><span class="sr-sub" style="font-size:11px">${projectSkills().length} 个已配置</span></div><button type="button" class="sr-button quiet sr-back" data-action="back">${icon('arrow-left')}返回清单</button><div class="sr-split"><div class="sr-list">${renderList(false)}<div class="sr-summary"><span class="sr-state ok"><i class="sr-dot"></i>${t.ok} 条正常</span><span class="sr-state warn"><i class="sr-dot"></i>${t.missing} 条待创建</span><span class="sr-state error"><i class="sr-dot"></i>${t.conflict} 处冲突</span></div>${state.untracked.length?`<div class="sr-note">${state.untracked.length} 个 Skill 已从配置移除，其现有链接保留，后续可单独清理。</div>`:''}</div>${renderDetail(false)}</div>`}</section>`;
      }
      if(state.page==='registry')return header('全局管理 / 共享内容','中心仓库','一份内容，供所有项目与 Agent 使用。',btn(icon('refresh-cw')+' 检查更新','check-updates')+btn(icon('plus')+' 注册 Skill','register','primary'))+`<div class="sr-toolbar"><label class="sr-search">${icon('search')}<input data-role="search" aria-label="搜索中心仓库" placeholder="搜索中心仓库中的 Skill…" value="${esc(state.search)}"></label><select class="sr-select" data-role="filter" aria-label="Skill 来源"><option value="all" ${state.filter==='all'?'selected':''}>全部来源</option><option value="git" ${state.filter==='git'?'selected':''}>Git 仓库</option><option value="local" ${state.filter==='local'?'selected':''}>本地副本</option></select></div>${state.checked?notice('已检查 Git 示例源：frontend-design 有 2 个提交可更新。','ok'):''}<button type="button" class="sr-button quiet sr-back" data-action="back">${icon('arrow-left')}返回清单</button><div class="sr-split"><div class="sr-list">${renderList(true)}<div class="sr-note">中心位置 <span class="sr-path">${esc(state.center)}</span></div></div>${renderDetail(true)}</div>`;

      }
      if(a==='default-preset'){state.presets.forEach((p,i)=>p.default=i===Number(target.dataset.index));return toast('全局默认 Target 已保存');}
      if(a==='restore-presets'){const preset={id:'qoder',path:'.qoder/skills'};if(!state.presets.some(p=>p.id===preset.id))state.presets.push(preset);return toast('缺失预设已恢复（示例：qoder）');}
      if(a==='new-group'||a==='edit-group')return openModal('group',{index:a==='new-group'?-1:Number(target.dataset.index)});
      if(a==='commit-group'){const name=value('group-name'),desc=value('group-desc'),skills=[...el.querySelectorAll('[data-member]:checked')].map(n=>n.dataset.member);if(!name||!/^[a-zA-Z0-9_-]+$/.test(name))return error('请使用字母、数字、短横线或下划线命名。');if(state.groups.some((g,i)=>g.name===name&&i!==m.index))return error('分组名称已存在。');const g={name,desc,skills};if(m.index<0)state.groups.push(g);else state.groups[m.index]=g;state.modal=null;return toast('分组已保存，项目清单保持原状');}
      if(a==='delete-group'){state.groups.splice(m.index,1);state.modal=null;return toast('分组已删除，已展开的项目 Skills 保留');}
      if(a==='use-group')return openModal('use-group',{index:Number(target.dataset.index)});
      if(a==='commit-use-group'){let n=0;state.groups[m.index].skills.forEach(id=>{const s=state.skills.find(s=>s.id===id);if(s&&!s.removed&&!s.project){s.project=true;s.refs++;s.links=state.targets.map(()=> 'missing');n++;}});state.modal=null;return toast(`已保存 ${n} 个新增引用，不建立持续分组关联`);}
      if(a==='commit-project'){const projectPath=value('project-path');if(!projectPath)return error('请选择工作区文件夹。');if(!/^(~\/|\/|[a-zA-Z]:[\\/])/.test(projectPath))return error('请填写绝对路径或 ~/ 开头的文件夹路径。');return selectWorkspace(projectPath);}
      if(a==='remove-config'||a==='forget-project')return openModal(a);
      if(a==='commit-remove-config'){state.modal=null;state.initialized=false;state.justInitialized=false;state.page='workspace-settings';state.lastWorkspacePage='workspace-settings';state.skills.forEach(s=>{s.project=false;});state.targets=[];snapshotWorkspace();return toast('项目配置已移入回收站（演示），链接保留');}
      if(a==='commit-forget-project'){snapshotWorkspace();if(!state.hiddenWorkspaces.includes(state.projectPath))state.hiddenWorkspaces.push(state.projectPath);state.modal=null;return toast('已移出最近列表，当前工作区与项目文件保留');}
      if(a==='change-center')return openModal('center');
      if(a==='check-center'){const path=value('center-path');if(!path)return error('请填写中心目录。');return openModal('center-confirm',{path});}
      if(a==='commit-center'){state.center=m.path;state.modal=null;projectSkills().forEach(s=>s.links=s.links.map(()=> 'conflict'));return toast('中心路径已保存；旧链接待另行处理');}
      if(a==='discard-yaml'){state.dirty=false;state.yamlDraft=null;return render();}
      if(a==='save-yaml'){
        if(shared.scenario==='外部修改')return openModal('external');
        const text=state.yamlDraft??yamlText();let parsed;
        try{parsed=parseDemoYaml(text);}catch(error){return toast(error.message);}
        const before=yamlText().split('\n'),after=text.split('\n');
        const diff=[...before.filter(x=>x&&!after.includes(x)).map(x=>'- '+x),...after.filter(x=>x&&!before.includes(x)).map(x=>'+ '+x)].join('\n')||'无内容变化';
        return openModal('yaml-diff',{text,...parsed,diff});
      }
      if(a==='commit-yaml'){
        const oldTargets=[...state.targets];
        state.skills.forEach(s=>{const before=s.project;s.project=m.ids.includes(s.id);if(s.project&&!before){s.refs++;s.links=oldTargets.map(()=> 'missing');}if(!s.project&&before){s.refs--;state.untracked.push(s.id);}});
        const detected=oldTargets.filter(t=>t.id==='codex'&&!m.targets.some(x=>x.id===t.id)).map(t=>({...t,source:'自动发现'}));
        state.targets=[...m.targets,...detected];
        if(!state.targets.length)state.targets=[{id:'claude-code',name:'Claude Code',path:'.claude/skills',source:'默认回退'}];
        projectSkills().forEach(s=>{s.links=state.targets.map(t=>{const oldIndex=oldTargets.findIndex(o=>o.id===t.id&&o.path===t.path);return oldIndex<0?'missing':s.links[oldIndex]||'missing';});});
        state.dirty=false;state.yamlDraft=null;state.modal=null;return toast('项目配置已保存（简化 YAML 演示）');
      }
      if(a==='external')return openModal('external');
      if(a==='reload-external'){const s=state.skills.find(s=>s.id==='api-review');if(s&&!s.removed&&!s.project){s.project=true;s.refs++;s.links=state.targets.map(()=> 'missing');}shared.scenario='标准项目';state.dirty=false;state.yamlDraft=null;state.modal=null;instances.forEach(x=>x.render());return toast('已载入外部版本（演示），本地修改未写入');}
    }
    el.addEventListener('click',event=>{
      const page=event.target.closest('[data-page]');if(page){if(state.dirty)return openModal('message',{title:'有未保存的 YAML 草稿',sub:'请先回到 YAML 保存或放弃修改。'});return navigate(page.dataset.page);}
      const tab=event.target.closest('[data-tab]');if(tab){if(tab.disabled)return;state.page='project';state.tab=tab.dataset.tab;state.lastWorkspacePage='project';state.search='';state.detail=false;render();return persist(state);}
      const skill=event.target.closest('[data-skill]');if(skill){state.selected=skill.dataset.skill;state.detail=true;render();return persist(state);}
      const control=event.target.closest('[data-action]');if(control&&!control.disabled)action(control.dataset.action,control);
    });
    el.addEventListener('input',event=>{
      const input=event.target;
      if(input.dataset.role==='search'){const start=input.selectionStart;state.search=input.value;render();const next=el.querySelector('[data-role="search"]');next.focus();next.setSelectionRange(start,start);}
      if(input.dataset.role==='yaml'){state.yamlDraft=input.value;state.dirty=true;const label=el.querySelector('[data-role="yaml-status"]');if(label)label.textContent='未保存';el.querySelector('.sr-footer span:last-child').textContent='配置有未保存修改';}
    });
    el.addEventListener('change',event=>{if(event.target.dataset.role==='filter'){state.filter=event.target.value;render();}if(event.target.dataset.role==='nav-select'){if(state.dirty){render();return openModal('message',{title:'有未保存的 YAML 草稿',sub:'保存或放弃草稿后，再切换页面。',path:workspaceConfig()});}const [page,tab]=event.target.value.split(':');if(tab)state.tab=tab;navigate(page);}});
    el.addEventListener('keydown',event=>{
      if(event.key==='Escape'&&state.modal){event.preventDefault();closeModal();return;}
      if((event.metaKey||event.ctrlKey)&&event.key==='k'){event.preventDefault();el.querySelector('[data-role="search"]')?.focus();}
      if(event.key==='Tab'&&state.modal){const controls=[...el.querySelectorAll('.sr-modal button:not(:disabled),.sr-modal input:not(:disabled),.sr-modal textarea,.sr-modal select')];const first=controls[0],last=controls[controls.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}
    });
    snapshotWorkspace();
    state.workspaceRecords['~/Projects/new-project']={name:'new-project',initialized:false,skillIds:[],links:{},targets:[],untracked:[]};
    if(root.dataset?.example==='initialize')selectWorkspace('~/Projects/new-project',{save:false});else render();
    return {state,render,el};
  }
  instances.push(makeApp('sr-workbench'));
  function applyDesign(){root.querySelectorAll('.sr').forEach(el=>el.style.setProperty('--s-row',shared.density==='紧凑'?'11px':'16px'));instances.forEach(x=>x.render());}
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:applyDesign});tweak.addSelect(shared,'density',{label:'列表密度',options:['舒适','紧凑']});tweak.addSelect(shared,'scenario',{label:'项目状态',options:['标准项目','YAML 错误','外部修改']});tweak.addSelect(shared,'initOutcome',{label:'初始化结果',options:['成功','首次失败']});}
  window.addEventListener('openai:set_globals',event=>{const value=event.detail?.globals?.widgetState?.privateContent;if(!value)return;instances.forEach(x=>{if(navs.some(n=>n.id===value.page))x.state.page=value.page;if(['skills','targets','yaml'].includes(value.tab))x.state.tab=value.tab;x.render();});});
})();
</script>
