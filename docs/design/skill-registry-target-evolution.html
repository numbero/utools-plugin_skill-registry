  function memberIds(t){const ids=custom(t)?[...t.cfg.skills,...disabledIds(t)]:commented(t)?t.commentedSkills:[],present=new Set(ids);return [...new Set([...(t.skillOrder||[]),...ids])].filter(id=>present.has(id));}

  function yaml(w){
    let out=`skills:${w.skills.length?'\n'+w.skills.map(s=>'  - '+s).join('\n'):' []'}\n`;
    const items=w.targets.filter(t=>t.explicit||Object.keys(t.cfg).length||commented(t)||(!t.detected&&!t.fallback));
    if(items.length){
      out+=items.some(enabled)?'targets:\n':'targets: {}\n';
      for(const t of items){
        const hasPath=Object.prototype.hasOwnProperty.call(t.cfg,'path');
        let block=`  ${t.id}:${hasPath||custom(t)?'\n':' {}\n'}`;
        if(hasPath)block+=`    path: ${t.cfg.path}\n`;
        if(custom(t)){
          block+=t.cfg.skills.length?'    skills:\n':'    skills: []\n';

      }
    }
    return out;
  }

    if(m.type==='presets-add')return modalShell('从预设添加目标','创建缺失目录，并将所选目标添加到当前工作区。',presets.map(p=>{const exists=ws().targets.some(t=>t.id===p.id);return`<label class="se-choice"><input type="checkbox" data-control="preset" data-target="${p.id}" data-focus-key="preset-${p.id}" ${m.ids.includes(p.id)?'checked':''} ${exists?'disabled':''}><span><strong>${p.name}</strong><small class="se-path">${p.path}</small><small>${exists?(enabled(target(p.id))?'已添加':'已添加 · 已停用，可回列表启用'):'目录待创建 · 将继承默认清单'}${p.path.startsWith('~')?' · 工作区外':''}</small></span></label>`;}).join(''),`<span class="se-push">已选 ${m.ids.length} 个</span>${cancel}${button('预览添加','save-presets','primary',m.ids.length?'':'disabled')}`);

    if(m.type==='skill-detail'){const id=m.id;return modalShell(id,byId(id)?.desc||'',ws().targets.map(t=>{const selected=targetSkills(t).includes(id),exists=(ws().links[t.id]||[]).includes(id);return`<div class="se-change"><span>${esc(name(t))}</span><span>${!enabled(t)?'已停用'+(exists?' · 已有链接保留':''):!selected?(custom(t)&&disabledIds(t).includes(id)?'技能已禁用 · 注释保留'+(exists?' · 已有链接保留':''):exists?'未选用 · 已有链接保留':custom(t)?'未纳入独立清单':'不在默认清单'):exists?'已链接':'待创建'}${selected?` · ${custom(t)?'独立清单':'继承默认'}`:''}</span></div>`;}).join('')+note('未被目标选用的 Skill 不记为缺失。停用目标的已有链接仍然保留。'),button('关闭','close'));}
    if(m.type==='references'){const refs=references(m.id);return modalShell(`配置关联 · ${m.id}`,'包含配置引用与注释保留清单；注释保留项不参与应用。',refs.length?refs.map(r=>`<div class="se-change"><span>${esc(r.workspace)}</span><span>${esc(r.text)}</span></div>`).join(''):'<p class="se-muted">暂无工作区配置引用。</p>',button('关闭','close'),true);}
    if(m.type==='show-config')return modalShell(state.scope==='global'?'全局 YAML':'项目 YAML',state.scope==='global'?'~/.skill-registry/global.yaml':cfgPath(),`<pre class="se-code">${esc(state.scope==='global'?globalYaml():yaml(ws()))}</pre>`,button('关闭','close'),state.scope==='global');
    return'';
  }
  function render(){const main=root.querySelector('.se-main'),body=root.querySelector('.se-dialog-body'),active=root.ownerDocument.activeElement,focus=active?.dataset?.focusKey,selection=active?.selectionStart,view=state.scope+state.page+state.workspace,modal=state.modal?.type+'|'+(state.modal?.id||'');const mainScroll=main?.scrollTop||0,bodyScroll=body?.scrollTop||0;
    root.innerHTML=`<div class="se-window"><div class="se-layout" ${state.modal?'inert':''}><aside class="se-side"><div class="se-brand"><img src="${logo}" alt=""><span>SkillRegistory<small>本机 Skill 管理</small></span></div>${scopeSwitch()}${state.scope==='workspace'?picker():''}<nav class="se-nav" aria-label="${state.scope==='workspace'?'工作区':'全局'}导航">${navs().map(([id,label,ic])=>`<button type="button" data-action="page" data-page="${id}" ${state.page===id?'aria-current="page"':''}>${icon(ic)}${label}<span class="se-count">${navCount(id)}</span></button>`).join('')}</nav></aside><div class="se-column"><div class="se-mobile">${scopeSwitch()}${state.scope==='workspace'?picker():''}<select data-control="page" aria-label="当前页面">${navs().map(([id,label])=>`<option value="${id}" ${state.page===id?'selected':''}>${label}</option>`).join('')}</select></div><main class="se-main">${content()}</main><footer class="se-footer"><span>${state.scope==='workspace'?esc(cfgPath()):'~/.skill-registry/global.yaml'}</span><span>${state.scope==='workspace'?'仅此工作区':'本机共享'}</span></footer></div></div>${renderModal()}${state.toast?`<div class="se-toast" role="status">${esc(state.toast)}</div>`:''}</div>`;
    if(view===lastView)root.querySelector('.se-main').scrollTop=mainScroll;
    if(state.modal){if(modal===lastModal){root.querySelector('.se-dialog-body').scrollTop=bodyScroll;const next=focus?[...root.querySelectorAll('[data-focus-key]')].find(el=>el.dataset.focusKey===focus):null;if(next){next.focus({preventScroll:true});if(next.setSelectionRange&&typeof selection==='number')try{next.setSelectionRange(selection,selection);}catch{}}}else(root.querySelector('.se-dialog [data-autofocus]')||root.querySelector('.se-dialog button'))?.focus({preventScroll:true});}
    lastView=view;lastModal=modal;if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});
  }
  function stateChange(id,value){const t=target(id);t.cfg.enabled=value;t.explicit=true;state.toast=value?'目标已启用':'目标已停用，已有链接保留';render();persist();}
  function click(action,el){const m=state.modal;
    if(action==='close')return close();
    if(action==='scope'){state.scope=el.dataset.scope;state.page=state.scope==='workspace'?'targets':'registry';state.modal=null;render();persist();return;}
    if(action==='page'){state.page=el.dataset.page;state.modal=null;render();persist();return;}
    if(action==='tab'){state.tab=el.dataset.tab;render();persist();return;}
    if(action==='workspaces')return open({type:'workspaces'});
    if(action==='switch-workspace'){state.workspace=el.dataset.workspace;state.page='targets';state.modal=null;render();persist();return;}
    if(action==='target-config'){const t=target(el.dataset.target);return open({type:'target-config',id:t.id,path:pathOf(t),mode:custom(t)?'custom':'inherit',hasCustom:custom(t)||commented(t),ids:memberIds(t),disabledIds:disabledIds(t).filter(id=>memberIds(t).includes(id))});}
    if(action==='defaults')return open({type:'defaults',ids:[...ws().skills]});
    if(action==='copy-defaults'){m.ids=[...ws().skills];m.disabledIds=[];m.hasCustom=true;render();return;}
    if(action==='clear-selected'){m.ids=[];m.disabledIds=[];m.hasCustom=true;render();return;}
    if(action==='add-target-skills')return open({type:'target-skill-picker',previous:clone(m),ids:[]});
    if(action==='confirm-target-skills'){const previous=clone(m.previous);previous.ids=[...new Set([...previous.ids,...m.ids])];previous.hasCustom=true;state.modal=previous;render();return;}
    if(action==='remove-target-skill'){m.ids=m.ids.filter(id=>id!==el.dataset.skill);m.disabledIds=m.disabledIds.filter(id=>id!==el.dataset.skill);m.hasCustom=true;render();return;}
    if(action==='save-target-config'){
      const t=target(m.id),value=m.path.trim();
      if(!value&&pathOf(t)){m.error='请填写部署路径。';render();return;}
      const next=clone(ws()),changed=next.targets.find(x=>x.id===t.id),pathChanged=value!==pathOf(t);
      if(pathChanged){
        if((next.links[t.id]||[]).length){next.previousLinks=next.previousLinks||[];next.previousLinks.push({name:name(t),path:fullPath(t),skills:[...next.links[t.id]]});}
        next.links[t.id]=[];changed.cfg.path=value;changed.explicit=true;
      }
      if(m.mode==='inherit'){if(m.hasCustom){changed.commentedSkills=[...m.ids];changed.explicit=true;}delete changed.cfg.skills;}
      else{changed.cfg.skills=m.ids.filter(id=>!m.disabledIds.includes(id));delete changed.commentedSkills;changed.explicit=true;}
      if(m.hasCustom){changed.disabledSkills=m.disabledIds.filter(id=>m.ids.includes(id));changed.skillOrder=[...m.ids];}
      const impact=(m.mode==='inherit'?(m.hasCustom?'将独立 skills 整段注释保留，主程序继承工作区默认清单；重新选择独立清单可取消注释恢复。':'继续继承工作区默认清单。'):(commented(t)?'取消独立 skills 清单的注释，恢复为生效配置。':'独立清单完整替换默认清单，不与默认成员合并。'))+(!enabled(t)?' 此目标保持停用。':m.mode==='custom'&&!m.ids.some(id=>!m.disabledIds.includes(id))?(m.ids.length?' 自定义技能均已禁用，保留 skills: []，不会回落到默认清单。':' 独立清单为空，不创建新链接。'):'')+' 已有链接保留；保存后单独预览并应用。';
      const original=memberIds(t),skillChanges={added:m.ids.filter(id=>!original.includes(id)),removed:original.filter(id=>!m.ids.includes(id)),enabled:m.ids.filter(id=>!m.disabledIds.includes(id)&&disabledIds(t).includes(id)),disabled:m.ids.filter(id=>m.disabledIds.includes(id)&&!disabledIds(t).includes(id))};
      return review(next,`配置 ${name(t)}`,`${modeText(t)} → ${modeText(changed,next)}${pathChanged?'；部署路径已更改':''}`,(pathChanged?'新路径只保存到工作区配置，旧路径中的链接保留。':'')+impact,m,{skillChanges});
    }
    if(action==='save-defaults'){const next=clone(ws());next.skills=[...m.ids];const inheritors=next.targets.filter(t=>enabled(t)&&!custom(t)).map(name);return review(next,'修改工作区默认清单',`${ws().skills.length} 个 → ${next.skills.length} 个 Skill`,`${inheritors.length?'影响：'+inheritors.join('、')+'。':'当前没有启用目标继承默认清单。'}所有独立清单保持原样；已有链接保留。`,m);}
    if(action==='review-back'){const previous=m.previous;if(previous.type==='state')return close();state.modal=previous;render();return;}
    if(action==='commit'){const changedSwitch=m.previous?.type==='state'?m.previous.id:null;state.workspaces[state.workspace]=clone(m.after);if(m.directories)ws().directories=[...new Set([...ws().directories,...m.directories])];state.modal=null;toast('配置已保存；链接按需单独预览并应用。');render();if(changedSwitch){const input=[...root.querySelectorAll('.se-switch input')].find(el=>el.dataset.target===changedSwitch);if(input){input.classList.add('se-switch-flip');input.addEventListener('animationend',()=>input.classList.remove('se-switch-flip'),{once:true});}}persist();return;}
    if(action==='links')return open({type:'links'});
    if(action==='apply-links'){let count=0;for(const {t,entries} of plan()){ws().links[t.id]=ws().links[t.id]||[];for(const e of entries)if(!e.linked){ws().links[t.id].push(e.skill);count++;}}m.result=count;render();persist();return;}
    if(action==='presets-add')return open({type:'presets-add',ids:[]});
    if(action==='save-presets'){const next=clone(ws());for(const id of m.ids)next.targets.push({id,cfg:{path:preset(id).path}});return review(next,'从预设添加目标',`新增 ${m.ids.length} 个目标，均继承默认清单`,'只创建所选缺失目录并保存当前工作区配置；Skill 链接仍需单独应用。',m,{directories:[...m.ids],confirm:'创建目录并添加'});}
    if(action==='target-path')return open({type:'target-path',id:el.dataset.target,value:pathOf(target(el.dataset.target))});
    if(action==='save-path'){if(!m.value?.trim()){m.error='请填写部署路径。';render();return;}const next=clone(ws()),t=target(m.id);if(m.value.trim()!==pathOf(t)){if((next.links[t.id]||[]).length){next.previousLinks=next.previousLinks||[];next.previousLinks.push({name:name(t),path:fullPath(t),skills:[...next.links[t.id]]});}next.links[t.id]=[];}next.targets.find(t=>t.id===m.id).cfg.path=m.value.trim();return review(next,'保存目标路径',name(target(m.id))+' → '+m.value.trim(),'只保存路径，保留启停状态和独立清单；已有目录与链接保持原位置。',m);}
    if(action==='skill-detail')return open({type:'skill-detail',id:el.dataset.skill});
    if(action==='references')return open({type:'references',id:el.dataset.skill});
    if(action==='show-config')return open({type:'show-config'});
  }
  root.addEventListener('click',event=>{const el=event.target.closest('button[data-action]');if(el&&root.contains(el))click(el.dataset.action,el);});
  root.addEventListener('input',event=>{const el=event.target;if(el.dataset.field&&state.modal){if(el.dataset.field==='target-path')state.modal.path=el.value;else state.modal.value=el.value;}});
  root.addEventListener('change',event=>{const el=event.target,m=state.modal,type=el.dataset.control;
    if(type==='page'){state.page=el.value;render();persist();}
    if(type==='enabled')stateChange(el.dataset.target,el.checked);
    if(type==='mode'&&m){m.mode=el.value;if(m.mode==='custom')m.hasCustom=true;render();}
    if(type==='member-enabled'&&m){const id=el.dataset.skill;m.disabledIds=el.checked?m.disabledIds.filter(x=>x!==id):[...new Set([...m.disabledIds,id])];m.hasCustom=true;const t=target(m.id),ids=memberIds(t);if(!ids.includes(id))ids.push(id);t.disabledSkills=el.checked?disabledIds(t).filter(x=>x!==id):[...new Set([...disabledIds(t),id])];t.skillOrder=ids;if(custom(t))t.cfg.skills=ids.filter(x=>!t.disabledSkills.includes(x));else t.commentedSkills=ids;t.explicit=true;state.toast=id+(el.checked?' 已启用':' 已禁用');render();persist();const input=[...root.querySelectorAll('[data-control=member-enabled]')].find(x=>x.dataset.skill===id);if(input){input.classList.add('se-switch-flip');input.addEventListener('animationend',()=>input.classList.remove('se-switch-flip'),{once:true});}}
    if(type==='target-skill-pick'&&m){m.ids=el.checked?[...new Set([...m.ids,el.dataset.skill])]:m.ids.filter(id=>id!==el.dataset.skill);render();}
    if(type==='skill'&&m){m.ids=el.checked?[...new Set([...m.ids,el.dataset.skill])]:m.ids.filter(id=>id!==el.dataset.skill);render();}
    if(type==='preset'&&m){m.ids=el.checked?[...m.ids,el.dataset.target]:m.ids.filter(id=>id!==el.dataset.target);render();}
  });
  root.addEventListener('keydown',event=>{if(!state.modal)return;if(event.key==='Escape'){event.preventDefault();close();return;}if(event.key==='Tab'){const nodes=[...root.querySelectorAll('.se-dialog button:not(:disabled),.se-dialog input:not(:disabled),.se-dialog select:not(:disabled),.se-dialog textarea:not(:disabled)')],first=nodes[0],last=nodes[nodes.length-1],active=root.ownerDocument.activeElement;if(event.shiftKey&&active===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&active===last){event.preventDefault();first?.focus();}}});
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState.privateContent);state.modal=null;render();}});
  render();
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{const w=initial();if(controls.scenario==='默认清单为空')w.skills=[];if(controls.scenario==='全部目标停用')w.targets.forEach(t=>t.cfg.enabled=false);if(controls.scenario==='停用目标缺失路径')w.targets.push({id:'legacy-agent',cfg:{enabled:false,skills:['research']}});state.workspaces[state.workspace]=w;state.scope='workspace';state.page=controls.scenario==='默认清单为空'?'skills':'targets';state.tab='defaults';state.modal=null;state.toast='';render();persist();}});tweak.addSelect(controls,'scenario',{label:'演示状态',options:['标准配置','默认清单为空','全部目标停用','停用目标缺失路径']});}
})();
</script>
